version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro-runtime:
        patterns: ["astro", "@astrojs/*", "vite"]
      testing:
        patterns: ["vitest", "@playwright/*", "@axe-core/*", "@lhci/*"]
